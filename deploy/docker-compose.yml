services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      NATURALIZE_DATABASE_DSN: postgres://naturalize:pass@postgres:5432/naturalize?sslmode=disable
      NATURALIZE_REDIS_ADDR: redis:6379
      NATURALIZE_STORAGE_ROOT_DIR: /app/var/data
      NATURALIZE_PROVIDERS_REWRITE_BASE_URL: ${NATURALIZE_PROVIDERS_REWRITE_BASE_URL:-http://mock-openai:8787}
      NATURALIZE_PROVIDERS_REWRITE_API_KEY: ${NATURALIZE_PROVIDERS_REWRITE_API_KEY:-dummy-rewrite-key}
      NATURALIZE_PROVIDERS_REWRITE_MODEL: ${NATURALIZE_PROVIDERS_REWRITE_MODEL:-gpt-4.1-mini}
      NATURALIZE_PROVIDERS_FALLBACK_BASE_URL: ${NATURALIZE_PROVIDERS_FALLBACK_BASE_URL:-http://mock-openai:8787}
      NATURALIZE_PROVIDERS_FALLBACK_API_KEY: ${NATURALIZE_PROVIDERS_FALLBACK_API_KEY:-dummy-chat-key}
      NATURALIZE_PROVIDERS_FALLBACK_MODEL: ${NATURALIZE_PROVIDERS_FALLBACK_MODEL:-gpt-4.1-mini}
      NATURALIZE_PROVIDERS_AGENT_BASE_URL: ${NATURALIZE_PROVIDERS_AGENT_BASE_URL:-http://mock-openai:8787}
      NATURALIZE_PROVIDERS_AGENT_API_KEY: ${NATURALIZE_PROVIDERS_AGENT_API_KEY:-dummy-agent-key}
      NATURALIZE_PROVIDERS_AGENT_MODEL: ${NATURALIZE_PROVIDERS_AGENT_MODEL:-gpt-4.1-mini}
      NATURALIZE_PROVIDERS_DETECTOR_BASE_URL: ${NATURALIZE_PROVIDERS_DETECTOR_BASE_URL:-}
      NATURALIZE_PROVIDERS_DETECTOR_API_KEY: ${NATURALIZE_PROVIDERS_DETECTOR_API_KEY:-}
      NATURALIZE_PROVIDERS_DETECTOR_MODEL: ${NATURALIZE_PROVIDERS_DETECTOR_MODEL:-}
      NATURALIZE_PROVIDERS_EMBEDDINGS_BASE_URL: ${NATURALIZE_PROVIDERS_EMBEDDINGS_BASE_URL:-}
      NATURALIZE_PROVIDERS_EMBEDDINGS_API_KEY: ${NATURALIZE_PROVIDERS_EMBEDDINGS_API_KEY:-}
      NATURALIZE_PROVIDERS_EMBEDDINGS_MODEL: ${NATURALIZE_PROVIDERS_EMBEDDINGS_MODEL:-}
      NATURALIZE_SCORING_DETECTOR_CACHE_TTL: ${NATURALIZE_SCORING_DETECTOR_CACHE_TTL:-24h}
    ports:
      - "${NATURALIZE_HTTP_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mock-openai:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: naturalize
      POSTGRES_USER: naturalize
      POSTGRES_PASSWORD: pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naturalize -d naturalize"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  mock-openai:
    image: node:25-alpine
    working_dir: /srv/mock-openai
    command: sh -lc "node server.mjs"
    volumes:
      - ./mock-openai:/srv/mock-openai:ro

volumes:
  pgdata:
